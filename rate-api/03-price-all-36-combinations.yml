settings:
  encodeUrl: true
  timeout: 5000

docs: |-
  Exactly the request the pricing service sends when it refreshes its cache: every `period x hotel x room`
  combination in one batch. It's as fast as pricing one room (~5 ms). When it succeeds, `rates` has all 36 entries in
  request order. When rates are missing, they're usually missing for all 36 entries at once, and the service then
  rejects the whole response.

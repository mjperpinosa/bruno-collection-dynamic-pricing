info:
  name: 08 Wrong token
  type: http
  seq: 8
  tags:
    - model

http:
  method: POST
  url: "{{rateApiUrl}}/pricing"
  headers:
    - name: token
      value: not-the-real-token
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "attributes": [
          { "period": "Summer", "hotel": "FloatingPointResort", "room": "SingletonRoom" }
        ]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("says Unauthorized", function () {
          expect(res.body.error).to.equal("Unauthorized");
        });

settings:
  encodeUrl: true
  timeout: 5000

docs: |-
  An incorrect `token`. Same as a missing token: always `401 {"error": "Unauthorized"}`, and it doesn't count against
  the daily quota. The model accepts exactly one hard-coded token.

docs:
  content: |-
    # Pricing Service

    Requests against the Rails pricing service (`GET /api/v1/pricing`). Every request expects **HTTP 200**.

    Start the stack first, from the `dynamic-pricing` project folder:

    ```bash
    docker compose up -d --build
    ```

    The first request after the service starts makes it fetch rates from the pricing model, which fails ~30% of the
    time. The service then answers `503` with a `Retry-After` header, by design. **01 Warm up the rate cache** retries
    until the first refresh succeeds, so the later 200 checks don't depend on that luck.

    If you've just run the **Rate API Limit** folder, the model's daily quota is used up. Once the service's cached
    rates expire (at most 5 minutes later) it can't refresh, and these requests return `503`. Restore the quota with
    `docker compose restart rate-api`.
  type: text/markdown
